<title>Batak Keyfi</title>
<meta name="description" content="Batak Keyfi — İhaleli ve Eşli Batak, iOS ve Android için.">
<style>
  :root {
    --felt: #14532d;
    --felt-deep: #0b3a1f;
    --ink: #f5f1e6;
    --muted: #b9c9bd;
    --gold: #e3c16f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: radial-gradient(ellipse at 50% 35%, var(--felt) 0%, var(--felt-deep) 75%);
    color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .suits { font-size: 28px; letter-spacing: 14px; margin-right: -14px; color: var(--gold); }
  h1 { font-size: clamp(44px, 12vw, 72px); margin: 12px 0 8px; letter-spacing: 2px; font-weight: 700; }
  p { margin: 6px 0; max-width: 30em; }
  .en { color: var(--muted); font-size: 15px; }
  .soon {
    display: inline-block;
    margin-top: 28px;
    padding: 8px 18px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="suits" aria-hidden="true">♠♥♦♣</div>
    <h1>Batak Keyfi</h1>
    <p>İhaleli Batak ve Eşli Batak — bilgisayara karşı ya da üç kişiyle çevrim içi.</p>
    <p class="en" lang="en">The Turkish trick-taking card game, for iOS and Android.</p>
    <div class="soon">Yakında · Coming soon</div>
  </main>
  <footer>
    <p><a href="mailto:batakkeyfi@outlook.com">batakkeyfi@outlook.com</a></p>

      <a href="impressum.html">Impressum</a>
    </p>
    <p>© 2026 Okan Erdoğan</p>
  </footer>
</body>
</html>
